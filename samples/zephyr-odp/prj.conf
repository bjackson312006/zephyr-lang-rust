# The default 1k stack isn't large enough for rust string formatting with logging.
CONFIG_MAIN_STACK_SIZE=8192

CONFIG_RUST=y

CONFIG_RUST_ALLOC=y
CONFIG_LOG=y

# The embassy-time driver is told our tick rate statically via the `tick-hz-10_000`
# Cargo feature (see Cargo.toml). But, this doesn't always match with Zephyr's tick
# rate (i'm pretty sure it can differ from board to board). So, I'm just going to set the
# Zephyr tick rate to 10,000 here across the board
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000

# RTT logging
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n

# RTT buffer configuration
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=256
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y

# Add sensor
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SENSOR_INIT_PRIORITY=90

# Stuff for UART
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_DMA=y
CONFIG_DMA_MCUX_LPC=y   
CONFIG_STDOUT_CONSOLE=n # u_Note: same as below, turning off the zephyr uart logging so it doesn't collide with our uart-service stuff
CONFIG_UART_CONSOLE=n # u_Note: turning off the zephyr uart logging so it doesn't collide with our uart-service stuff

# Stuff for RTC
CONFIG_RTC=y
CONFIG_RTC_ALARM=y
CONFIG_RTC_UPDATE=y
CONFIG_RTC_CALIBRATION=y

# Stuff for battery
CONFIG_FUEL_GAUGE=y
CONFIG_SBS_GAUGE_NEW_API=y
CONFIG_EMUL=y
CONFIG_EMUL_SBS_GAUGE=y

# PWM Fan config
CONFIG_PWM=y
