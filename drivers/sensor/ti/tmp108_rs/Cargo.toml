[package]
name = "tmp108_rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
embedded-sensors-hal = "0.1.0"
log = "0.4.22"
paste = "1.0"
spin = "0.10.0"
tmp108 = { git = "https://github.com/OpenDevicePartnership/tmp108" }
zephyr = "0.1.0"

[build-dependencies]
zephyr-build = "0.1.0"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
panic = "abort"

[profile.release]
opt-level = 3
debug = false
overflow-checks = true
panic = "abort"

[lints.clippy]
suspicious = "forbid"
correctness = "forbid"
perf = "forbid"
style = "forbid"
